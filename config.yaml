# TradingBot settings. Edit this file to change what the bot watches.
# Secrets (Telegram bot token, chat id) never go here: they live in
# GitHub repository secrets and are read from environment variables.

exchange: bitget          # any CCXT exchange id works (e.g. kraken, coinbase)
quote: USDT
timeframe: 4h             # candle size used for trend and stop-loss maths

# Coins the bot analyses. Keys are tickers; values are the words that count
# as a mention in a post. Ambiguous English words (ton, link, dot) are left
# out on purpose: those coins only count when written as $TON, $LINK, $DOT.
watchlist:
  BTC: [bitcoin, btc]
  ETH: [ethereum, eth, ether]
  SOL: [solana, sol]
  XRP: [xrp, ripple]
  BNB: [bnb]
  DOGE: [dogecoin, doge]
  ADA: [cardano, ada]
  AVAX: [avalanche, avax]
  LINK: [chainlink]
  TON: [toncoin]
  SUI: [sui]
  DOT: [polkadot]

sources:
  lookback_hours: 24
  # Public Telegram channels run by traders you trust, by their t.me name
  # (for https://t.me/example the name is "example"). Read from Telegram's
  # public web preview, so no login or API key is needed.
  # weight = how much each channel counts, set from your track-record table:
  # 1.5 strong edge, 1.0 decent or unproven, 0.5 too few trades, 0.3 losing.
  # These channels mostly post leveraged futures calls; the bot reads them only
  # as bullish/bearish opinion on a coin, never as trades to copy.
  telegram_channels:
    - {name: gorilla_crypto, weight: 1.5}       # Gorilla Crypto: +2.1%/trade, 48 signals
    - {name: learn2tradectypto, weight: 1.5}    # Learn 2 Trade Crypto: +1.1%, 433 signals
    - {name: BitcoinBullets, weight: 1.5}       # Bitcoin Bullets: +0.6%, 646 signals
    - {name: theanalystcrypto, weight: 1.0}     # The Analyst CRYPTO: +1.4%, only 28 signals
    - {name: cryptoinnercycles, weight: 1.0}    # Crypto Inner Circle: no profit data yet
    # Not added yet (no links): Altcoin Daily Signals, CRYPTO PROOF,
    # Fed. Russian Insiders, GoBox Crypto Tarder, CryptoNinjas Trading
  subreddits: [CryptoCurrency, CryptoMarkets, Bitcoin, ethtrader]
  rss_feeds:
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
    - https://decrypt.co/feed
  # How much each source counts towards sentiment.
  weights:
    telegram: 1.5
    reddit: 1.0
    news: 1.2

# AI reading of posts, every 4 hours.
# Default "local": the free CryptoBERT model runs inside the bot. No account,
# key or bill.
# Optional alternatives with an API key (they have free tiers, with limits):
#   provider: gemini                   secret GEMINI_API_KEY, model: gemini-flash-latest
#   provider: openai_compatible        secret AI_API_KEY, e.g. Zhipu:
#     base_url: https://api.z.ai/api/paas/v4
#     model: glm-4.7-flash
ai:
  enabled: true
  provider: local
  model: ""
  base_url: ""

risk:
  account_size: 1000          # in USDT; used only to size suggestions
  risk_per_trade_pct: 1.0     # max loss per trade if the stop is hit
  max_position_pct: 25        # never suggest more than this share of the account
  atr_stop_multiplier: 2.0    # stop-loss distance in ATRs below entry
  min_24h_volume: 20000000    # skip illiquid markets (USDT volume)
  min_score_to_suggest: 65
  max_suggestions: 5

# Trend signals for Bitcoin and Ethereum: the rule set that passed testing on
# 2023-2026 prices it was never designed on (see bot/trend.py). Sends a Telegram
# message when a position should change by 5% of the account or more.
trend:
  enabled: true

# Altcoin trend portion (bot/altsleeve.py): 25% of the account spread over the
# top-20 altcoins that are trending, BTC/ETH signals use the other 75%.
alt_sleeve:
  enabled: true

# Hidden-gem scanner. Every morning it scans the 1,000 most-traded coins across
# every narrative, keeps small Bitget-listed ones, runs safety checks, and
# sends the best to Telegram. The 4-hourly runs re-check their timing.
emerging:
  enabled: true
  min_market_cap: 10000000    # 10M USD: smaller is too easy to manipulate
  max_market_cap: 300000000   # 300M USD: bigger is no longer "little-known"
  min_volume: 500000          # USD traded a day across all exchanges
  min_bitget_volume: 300000   # USDT traded a day on Bitget, so you can get in and out
  max_7d_gain: 150            # skip anything up more than 150% in a week (likely a pump)
  min_unlocked: 0.35          # at least 35% of supply already in circulation
  min_age_days: 14            # at least 2 weeks of trading history on Bitget
  universe_pages: 4           # x250 most-traded coins on CoinGecko
  max_details: 20             # candidates checked in depth each morning
  report_size: 5              # picks in the morning Telegram report
  max_position_pct: 10        # never more than 10% of the account in one small token

alerts:
  strong_score: 72            # alert when a coin's score reaches this
  price_move_pct: 5           # alert on a move this big since the last check
  sentiment_shift: 0.35       # alert on a sentiment swing this big (-1..1 scale)
  cooldown_hours: 6           # don't repeat the same alert sooner than this
