name: Publish dashboard

on:
  push:
    branches: [main]
    paths: ["site/**"]
  # The bot's own dashboard commits don't trigger push workflows, so also publish after each run.
  workflow_run:
    workflows: ["4-hour analysis", "Morning hidden gems", "Weekly accuracy check"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
