name: Real-time alerts

on:
  schedule:
    - cron: "*/30 * * * *"  # every 30 min keeps a private repo inside GitHub's free 2,000 min/month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alerts
  cancel-in-progress: true

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Alert memory (what was already sent) lives in the Actions cache, not in git,
      # so frequent runs don't fill the repo with commits.
      - uses: actions/cache@v4
        with:
          path: data/alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      - name: Check for alerts
        run: python -m bot.main run --alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
