name: Morning hidden gems

on:
  schedule:
    - cron: "0 6 * * *"     # 07:00 UK summer time, 06:00 winter (GitHub may start it a few minutes late)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ai.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cryptobert-v1
      - name: Scan for hidden gems, update dashboard, send morning report
        run: python -m bot.main run --publish --morning
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      - name: Save dashboard and track record
        run: |
          git config user.name "tradingbot"
          git config user.email "tradingbot@users.noreply.github.com"
          git add data/latest.json data/history.jsonl data/state.json site $(ls data/emerging.json data/gem_history.jsonl data/tuned.json data/backtest.json 2>/dev/null)
          git diff --cached --quiet || git commit -m "Morning scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
